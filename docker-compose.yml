version: '3.8'

networks:
  fault-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  redis-insight-data:
  mlflow_data:
  kafka_data:


services:
  # ============= VICTIM SERVER =============
  victim-app:
    build:
      context: ./victim-server
      dockerfile: Dockerfile
    container_name: victim-app
    ports:
      - "8000:8000"
    networks:
      - fault-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./victim-server:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC

  # ============= REDIS =============
  redis:
    image: redis:7-alpine
    container_name: victim-redis
    ports:
      - "6379:6379"
    networks:
      - fault-network
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes
                   --maxmemory 200mb
                   --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============= REDIS INSIGHT =============
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    networks:
      - fault-network
    volumes:
      - redis-insight-data:/data
    restart: unless-stopped

  # ============= PROMETHEUS =============
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - fault-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # ============= GRAFANA (NEW) =============
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - fault-network
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ============= KAFKA =============
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fault-network
    restart: unless-stopped

  # ============= MLFLOW =============
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow_data/mlflow.db --artifacts-destination /mlflow_data/artifacts
    volumes:
      - ./mlflow_data:/mlflow_data
    networks:
      - fault-network
