version: '3.8'

networks:
  fault-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  redis-insight-data:
  mlflow_data:
  kafka_data:


services:
  # ============= VICTIM SERVER =============
  victim-app:
    build:
      context: ./victim-server
      dockerfile: Dockerfile
    container_name: victim-app
    ports:
      - "8000:8000"
    networks:
      - fault-network
    depends_on:
      redis:
        condition: service_healthy
      kafka-broker:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    # 🔴 FIXED: REMOVED volume override
    # volumes:
    #   - ./victim-server:/app   # <-- COMMENTED OUT - DO NOT USE
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.8'
        reservations:
          memory: 256m
          cpus: '0.3'
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ============= REDIS =============
  redis:
    image: redis:7-alpine
    container_name: victim-redis
    ports:
      - "6379:6379"
    networks:
      - fault-network
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes
                   --maxmemory 200mb
                   --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============= REDIS INSIGHT =============
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    networks:
      - fault-network
    volumes:
      - redis-insight-data:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # ============= PROMETHEUS =============
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - fault-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    depends_on:
      - victim-app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============= GRAFANA =============
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - fault-network
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============= KAFKA (FIXED) =============
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker:9092
      # ✅ FIXED: Added missing listener configuration
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_LOG_RETENTION_BYTES=10737418240
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============= MLFLOW (FIXED VOLUME) =============
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000 
      --backend-store-uri sqlite:////mlflow/mlflow.db 
      --artifacts-destination /mlflow/artifacts
    # ✅ FIXED: Using named volume consistently
    volumes:
      - mlflow_data:/mlflow
    networks:
      - fault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============= KAFKA UI (Optional - for debugging) =============
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    networks:
      - fault-network
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_started
    restart: unless-stopped